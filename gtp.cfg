# ── 日志 ──────────────────────────────
logToStderr = true
logAllGTPCommunication = false
logSearchInfo = false

# ── 规则 ───────────────────────────────
koRule = POSITIONAL
scoringRule = AREA
taxRule = NONE
multiStoneSuicideLegal = false
hasButton = false
whiteHandicapBonus = 0
friendlyPassOk = true

# ── 内存优化（缓存从默认100万条降到1024条，节省约300MB）──
nnCacheSizePowerOfTwo = 10
nnMutexPoolSizePowerOfTwo = 9

# ── 搜索参数 ───────────────────────────
ponderingEnabled = false
numSearchThreads = 1
maxVisits = 500

# ── 分析输出格式 ───────────────────────
reportAnalysisWinratesAs = SIDETOMOVE
