# ── 日志 ──────────────────────────────
logToStderr = true
logAllGTPCommunication = false
logSearchInfo = false

# ── 规则 ───────────────────────────────
koRule = POSITIONAL
scoringRule = AREA
taxRule = NONE
multiStoneSuicideLegal = false
hasButton = false
whiteHandicapBonus = 0
friendlyPassOk = true

# ── 内存优化（关键！默认缓存会占用300MB+）──
# nnCacheSizePowerOfTwo = N 表示缓存 2^N 条评估结果
# 默认值 20（约100万条），改为 10（1024条）节省约300MB
nnCacheSizePowerOfTwo = 10
nnMutexPoolSizePowerOfTwo = 9

# ── 搜索参数 ───────────────────────────
ponderingEnabled = false
numSearchThreads = 1
maxVisits = 200

# ── 分析输出格式 ───────────────────────
reportAnalysisWinratesAs = SIDETOMOVE
