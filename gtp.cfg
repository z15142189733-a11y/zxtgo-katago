# KataGo GTP 最小配置
# 完整配置说明：https://github.com/lightvector/KataGo/blob/master/cpp/configs/gtp_example.cfg

# 搜索线程数（Render 免费版 CPU 有限，2 线程够用）
numSearchThreads = 2

# 默认思考量（API 会在每次请求时通过 kata-set-param 动态覆盖此值）
maxVisits = 500

# 关闭 pondering（后台思考），节省资源
ponderingEnabled = false

# 日志级别
logToStderr = true
logSearchInfo = false
