services:
  - type: web
    name: zxtgo-katago
    runtime: python
    region: singapore       # 推荐：新加坡节点，亚洲延迟最低
    plan: free              # 免费计划（15分钟无访问后自动休眠）
    buildCommand: bash build.sh && pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"      # Render 默认监听端口
      - key: KATAGO_BIN
        value: "./katago"
      - key: MODEL_PATH
        value: "./models/model.bin.gz"
      - key: CONFIG_PATH
        value: "./gtp.cfg"
